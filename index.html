<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RestaurantOS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">
            <h1>RestaurantOS</h1>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Speisekarte</a>
                <a href="#">Bestellungen</a>
                <a href="#">Reservierungen</a>
                <a href="#">Tische</a>
                <a href="#">Mitarbeiter</a>
            </nav>
        </aside>

        <div class="content">

            <header class="topbar">
                <div>
                    <h2>Dashboard</h2>
                    <p id="current-date"></p>
                </div>

                <div class="topbar-user">
                    <span>Restaurant Demo</span>
                    <strong>Admin</strong>
                </div>
            </header>

            <main>

                <section>
                    <p>Willkommen bei RestaurantOS.</p>

                    <div class="dashboard-grid">

                        <div class="dashboard-grid">

                            <div class="card">
                                <h3>Gerichte gesamt</h3>
                                <p id="total-dishes">0</p>
                            </div>

                            <div class="card">
                                <h3>Verfügbar</h3>
                                <p id="available-dishes">0</p>
                            </div>

                            <div class="card">
                                <h3>Ausverkauft</h3>
                                <p id="sold-out-dishes">0</p>
                            </div>

                            <div class="card">
                                <h3>Ø Preis</h3>
                                <p id="average-price">0,00 €</p>
                            </div>

                        </div>

                    </div>

                    <button>Neue Bestellung</button>
                </section>

                <section class="menu-section">

                    <div class="section-header">
                        <div>
                            <h2>Speisekarte</h2>
                            <p>Gerichte und Getränke verwalten</p>
                        </div>
                    </div>

                    <form id="dish-form">

                        <div class="form-group">
                            <label for="dish-name">Name</label>

                            <input
                                type="text"
                                id="dish-name"
                                placeholder="z. B. Pizza Margherita"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="dish-price">Preis</label>

                            <input
                                type="number"
                                id="dish-price"
                                step="0.01"
                                min="0"
                                placeholder="12.90"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="dish-category">Kategorie</label>

                            <select id="dish-category" required>
                                <option value="">Kategorie wählen</option>
                                <option value="Vorspeise">Vorspeise</option>
                                <option value="Hauptgericht">Hauptgericht</option>
                                <option value="Dessert">Dessert</option>
                                <option value="Getränk">Getränk</option>
                            </select>
                        </div>

                        <button type="submit">
                            Gericht hinzufügen
                        </button>

                    </form>

                    <div class="menu-controls">

                        <input
                            type="text"
                            id="dish-search"
                            placeholder="Gericht suchen..."
                        >

                        <select id="category-filter">
                            <option value="Alle">Alle Kategorien</option>
                            <option value="Vorspeise">Vorspeise</option>
                            <option value="Hauptgericht">Hauptgericht</option>
                            <option value="Dessert">Dessert</option>
                            <option value="Getränk">Getränk</option>
                        </select>

                        <select id="status-filter">
                            <option value="Alle">Alle Status</option>
                            <option value="Verfügbar">Verfügbar</option>
                            <option value="Ausverkauft">Ausverkauft</option>
                        </select>

                        <select id="sort-dishes">
                            <option value="name-asc">Name A–Z</option>
                            <option value="name-desc">Name Z–A</option>
                            <option value="price-asc">Preis aufsteigend</option>
                            <option value="price-desc">Preis absteigend</option>
                        </select>

                    </div>

                    <div id="dish-list" class="dish-list"></div>

                </section>

            </main>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
